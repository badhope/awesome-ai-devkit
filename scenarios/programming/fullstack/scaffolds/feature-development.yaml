# ──────────────────────────────────────────────────────────────────
# 全栈开发 — 功能开发 Scaffold v2.0
#
# 使用:
#   cp scenarios/programming/fullstack/scaffolds/feature-development.yaml ./scaffold.yaml
# ──────────────────────────────────────────────────────────────────

version: "2.0"

task:
  name: "feature-development"
  description: "端到端功能开发：从需求到部署"
  type: feature

memory:
  - context/project.yaml
  - context/architecture.md
  - CHANGELOG.md

steps:

  # ── 阶段 1: 串行前置 ────────────────────────────────────
  - goal: "需求分析与验收标准"
    description: "将模糊需求转化为可执行的验收标准，自动补充技术栈和约束"
    skills: [instruction-grooming, task-tracker]
    outputs:
      - docs/requirements/<feature>.md:
          contains: [验收标准, 测试场景]

  - goal: "技术方案设计 + ADR 记录"
    description: "API 设计、数据模型、数据库 Schema，记录架构决策"
    skills: [integration-patterns, project-health]
    outputs:
      - docs/design/feat-<feature>.md:
          contains: [API, 数据模型]
      - context/architecture.md:
          append: true
          contains: [ADR]

  # ── 阶段 2: 并行实现 ────────────────────────────────────
  - goal: "后端 API + 数据库实现"
    parallel: true
    skills: [devkit-infra, devkit-utilities]
    outputs:
      - src/api/<feature>/<controller>.py:
          contains: [router, service]
      - tests/unit/test_<feature>.py:
          contains: [test_]
    quality_gate: "后端单元测试全部通过"

  - goal: "前端 UI 实现"
    parallel: true
    skills: [linter-formatter, web-browser-vision]
    outputs:
      - frontend/app/<feature>/page.tsx:
          contains: [export default]
    quality_gate: "前端 build 无 error"

  # ── 阶段 3: 串行后置 ────────────────────────────────────
  - goal: "集成测试 + E2E 核心流"
    description: "验证前后端联调，核心用户流 E2E 覆盖"
    skills: [code-duplication, mutation-testing, project-health]
    outputs:
      - tests/integration/test_<feature>.py:
          contains: [test_]
    quality_gate: "集成测试全部通过，核心 E2E 场景通过"

  - goal: "代码审查 + 安全检查"
    description: "Agent 自审：对照安全 skill 清除硬编码密钥、SQL 注入、权限绕过"
    skills: [security-governance, linter-formatter]
    quality_gate: "无安全高危漏洞；无硬编码密钥；SQL 参数化；权限中间件覆盖"

  - goal: "预发布验证 + 生产发布"
    skills: [semantic-release, git-workflow]
    quality_gate: "staging smoke 测试通过；CHANGELOG 已更新；回滚方案已记录"

post_task:
  quality_gates:
    - "全量测试通过: 运行项目测试命令，所有 pass"
    - "覆盖率 ≥ 60%（核心业务模块）"
    - "无安全硬编码泄露: grep 敏感词仅出现在 test/mock 中"
    - "CHANGELOG 已更新"
    - "memory-persistent 已更新（如有架构决策）"
    - "pragmatic-guard: python3 framework/lib/scripts/quality/pragmatic-guard.py --project . 退出 exit 0（无重复造/冗余/虚假实现/过度设计/不合业务）"
    - "loop-verification: 自动循环验证所有质量门禁，最多 3 轮"
  loop_config:
    max_loops: 3
    fail_threshold: 0
    auto_fix: true
